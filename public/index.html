<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prefor.Pon</title>
<meta name="description" content="Colliding galaxies on the GPU — particle-mesh gravity, one draw call.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="Particle field"></canvas>

<p class="n" id="n" aria-live="off"></p>
<div class="clock" id="clock">
  <button id="pause" aria-label="Pause" aria-pressed="false">
    <svg viewBox="0 0 12 12" aria-hidden="true"><path class="bars" d="M3.5 2v8M8.5 2v8"/><path class="play" d="M3 1.5v9l7.5-4.5z"/></svg>
  </button>
  <input id="rate" type="range" min="-3" max="2" step="1" value="-1" aria-label="Time rate">
  <output id="myr" for="rate"></output>
</div>
<button class="again" id="again" aria-label="New galaxies">↻</button>
<button class="learn" id="learn" aria-label="Replay tutorial">?</button>

<div id="tut" class="tut" hidden>
  <div class="finger" aria-hidden="true"></div>
  <p class="word" id="word"></p>
  <button class="skip" id="skip" aria-label="Skip tutorial">×</button>
</div>

<div id="nogpu" class="nogpu" hidden><p>WebGPU <span>×</span></p></div>

<script type="module" src="main.js"></script>
</body>
</html>
